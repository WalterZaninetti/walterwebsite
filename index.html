<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Walter — software developer in Italy. Small tools, made carefully: a mana-base calculator for Magic players, a Rekordbox dashboard for DJs, and a seasonal produce guide."
    />
    <meta name="theme-color" content="#eef0e6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141a15" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Fonts come straight from the design doc: Instrument Serif (display),
      Space Grotesk (UI/body), IBM Plex Mono (labels and metadata) and Libre
      Baskerville (the editorial italics on the Magic Tools card).

      They are self-hosted (src/assets/fonts, declared in
      src/design-system/fonts.css) rather than pulled from a font CDN, so
      rendering the page never discloses a visitor's IP to a third party. That
      is what lets the cookie notice say this site contacts nobody.

      They are deliberately not preloaded from here: Vite content-hashes and
      relocates assets referenced from CSS, so any path hardcoded in this file
      would 404 in the build. The @font-face rules are discovered when the
      (render-blocking) stylesheet parses, and font-display: swap keeps text
      visible meanwhile. To add real preloads, move the woff2 files to
      public/fonts so their URLs become stable.
    -->

    <title>Walter — small tools, made carefully</title>

    <!--
      Resolve the theme before first paint so a dark-mode visitor never sees a
      flash of the light palette. Kept inline and tiny on purpose; the same
      storage key is read back by src/lib/theme.tsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('walter-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* private mode — fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
